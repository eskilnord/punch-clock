<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stämpelklocka</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/idb@7.1.1/build/umd.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/jspdf-autotable@3.5.28/dist/jspdf.plugin.autotable.min.js"></script>

<body class="bg-gray-100 min-h-screen">
  <div id="root" class="container mx-auto p-4"></div>
  
  <!-- Load local scripts -->
  <script type="text/babel" src="./db.js"></script>
  <script type="text/babel" src="./utils.js"></script>
  <script type="text/babel" src="./components/EmployeeForm.js"></script>

  <script type="text/babel" src="./components/AdminPanel.js"></script>
  <script type="text/babel" src="./app.js"></script>
  
  <script type="text/babel">
    // Start app after everything is loaded
    window.addEventListener('load', () => {
      console.log('Components loaded, starting app...');
      setTimeout(() => {
        ReactDOM.render(<App />, document.getElementById('root'));
        console.log('App rendered');
      }, 500);
    });
  </script>

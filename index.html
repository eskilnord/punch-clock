<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stämpelklocka</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  
  <!-- React and libraries with crossorigin attribute -->
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/idb@7.1.1/build/umd.js" crossorigin></script>
  <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js" crossorigin></script>
  <script src="https://unpkg.com/jspdf-autotable@3.5.28/dist/jspdf.plugin.autotable.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <script src="https://unpkg.com/crypto-js@4.1.1/crypto-js.js" crossorigin></script>
  
  <!-- Debug script to help identify issues -->
  <script>
    console.log("Page loading started...");
    window.onerror = function(message, source, lineno, colno, error) {
      console.error("Global error caught:", message, "at", source, "line", lineno);
      if (document.getElementById('root')) {
        document.getElementById('root').innerHTML = `
          <div style="background-color: #fee2e2; color: #b91c1c; padding: 20px; border-radius: 8px; margin: 20px; font-family: sans-serif;">
            <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">Ett fel uppstod</h2>
            <p>${message}</p>
            <p style="margin-top: 10px;">Fel på rad ${lineno} i ${source.split('/').pop()}</p>
          </div>
        `;
      }
      return true;
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root" class="container mx-auto p-4">
    <!-- Loading indicator that will be replaced when React renders -->
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-600">Laddar...</p>
      </div>
    </div>
  </div>
  
  <!-- Database and Utilities with relative paths -->
  <script type="text/babel" src="db.js"></script>
  <script type="text/babel" src="utils.js"></script>
  
  <!-- Components with relative paths -->
  <script type="text/babel" src="components/EmployeeForm.js"></script>
  <script type="text/babel" src="components/AdminLogin.js"></script>
  <script type="text/babel" src="components/AdminPanel.js"></script>
  
  <!-- Main App Script -->
  <script type="text/babel" src="app.js"></script>
  
  <!-- Diagnostic script to check service availability -->
  <script type="text/babel">
    console.log("Diagnostic check:", {
      ReactExists: typeof React !== 'undefined',
      ReactDOMExists: typeof ReactDOM !== 'undefined',
      dbServiceExists: typeof dbService !== 'undefined',
      utilsExists: typeof utils !== 'undefined',
      EmployeeFormExists: typeof EmployeeForm !== 'undefined',
      AdminLoginExists: typeof AdminLogin !== 'undefined',
      AdminPanelExists: typeof AdminPanel !== 'undefined',
      AppExists: typeof App !== 'undefined',
    });
  </script>
  
  <!-- Initialize the application - Simplified approach -->
  <script type="text/babel">
    console.log("Starting initialization script...");
    
    // Initial Setup Component definition if it's missing
    if (typeof InitialSetup === 'undefined') {
      console.log("Defining InitialSetup component");
      window.InitialSetup = ({ onComplete }) => {
        const [pin, setPin] = React.useState('');
        const [confirmPin, setConfirmPin] = React.useState('');
        const [error, setError] = React.useState('');
        
        const handleSubmit = (e) => {
          e.preventDefault();
          if (pin.length < 4) {
            setError('PIN-koden måste vara minst 4 siffror.');
            return;
          }
          
          if (pin !== confirmPin) {
            setError('PIN-koderna matchar inte.');
            return;
          }
          
          // Hash the PIN and save it
          const pinHash = CryptoJS.SHA256(pin).toString();
          dbService.saveConfig('pinHash', pinHash)
            .then(() => {
              onComplete();
            })
            .catch(err => {
              console.error(err);
              setError('Ett fel uppstod. Försök igen.');
            });
        };
        
        return (
          <div className="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto">
            <h2 className="text-2xl font-bold mb-4 text-center">Första konfiguration</h2>
            <p className="mb-4 text-gray-600">
              Välkommen! Skapa en admin PIN-kod för att komma igång med stämpelklockan.
            </p>
            
            <form onSubmit={handleSubmit}>
              <div className="mb-4">
                <label htmlFor="pin" className="block text-gray-700 mb-2">Admin PIN-kod</label>
                <input
                  type="password"
                  id="pin"
                  placeholder="Ange PIN-kod (minst 4 siffror)"
                  value={pin}
                  onChange={(e) => setPin(e.target.value)}
                  className="w-full px-4 py-2 border rounded-md"
                  pattern="[0-9]*"
                  inputMode="numeric"
                />
              </div>
              
              <div className="mb-4">
                <label htmlFor="confirmPin" className="block text-gray-700 mb-2">Bekräfta PIN-kod</label>
                <input
                  type="password"
                  id="confirmPin"
                  placeholder="Bekräfta PIN-kod"
                  value={confirmPin}
                  onChange={(e) => setConfirmPin(e.target.value)}
                  className="w-full px-4 py-2 border rounded-md"
                  pattern="[0-9]*"
                  inputMode="numeric"
                />
              </div>
              
              {error && <p className="text-red-500 mb-4">{error}</p>}
              
              <button
                type="submit"
                className="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md"
              >
                Slutför konfiguration
              </button>
            </form>
          </div>
        );
      };
    }
    
    // Direct initialization with timeouts for more reliable loading
    setTimeout(function() {
      try {
        console.log("Rendering temporary loading state...");
        
        // First render a loading indicator to ensure something is displayed
        ReactDOM.render(
          <div className="flex items-center justify-center min-h-screen">
            <div className="text-center">
              <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
              <p className="mt-4 text-gray-600">Initierar applikation...</p>
            </div>
          </div>,
          document.getElementById('root')
        );
        
        // Then render the actual app after a delay
        setTimeout(function() {
          try {
            console.log("Rendering main App component...");
            ReactDOM.render(<App />, document.getElementById('root'));
            console.log("App rendered successfully");
          } catch (error) {
            console.error("Error rendering App:", error);
            document.getElementById('root').innerHTML = `
              <div style="background-color: #fee2e2; color: #b91c1c; padding: 20px; border-radius: 8px; margin: 20px; font-family: sans-serif;">
                <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">Fel vid rendering</h2>
                <p>${error.message}</p>
                <p style="margin-top: 10px;">Pröva att ladda om sidan</p>
              </div>
            `;
          }
        }, 500);
      } catch (error) {
        console.error("Initialization error:", error);
        document.getElementById('root').innerHTML = `
          <div style="background-color: #fee2e2; color: #b91c1c; padding: 20px; border-radius: 8px; margin: 20px; font-family: sans-serif;">
            <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">Initialiseringsfel</h2>
            <p>${error.message}</p>
            <p style="margin-top: 10px;">Pröva att ladda om sidan</p>
          </div>
        `;
      }
    }, 300);
  </script>
</body>
</html>

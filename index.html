<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stämpelklocka</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Use React 17 for better compatibility with our code -->
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/idb@7.1.1/build/umd.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/jspdf-autotable@3.5.28/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/crypto-js@4.1.1/crypto-js.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root" class="container mx-auto p-4"></div>
  
  <!-- Database and Utilities -->
  <script type="text/babel" src="./db.js"></script>
  <script type="text/babel" src="./utils.js"></script>
  
  <!-- Components -->
  <script type="text/babel" src="./components/EmployeeForm.js"></script>
  <script type="text/babel" src="./components/AdminLogin.js"></script>
  <script type="text/babel" src="./components/AdminPanel.js"></script>
  
  <!-- Main App Script -->
  <script type="text/babel" src="./app.js"></script>
  
  <!-- Initialize the application -->
  <script type="text/babel">
    // Wait for all components to be loaded
    window.addEventListener('load', () => {
      console.log('All scripts loaded, starting application...');
      setTimeout(() => {
        try {
          ReactDOM.render(<App />, document.getElementById('root'));
          console.log('Application started successfully!');
        } catch (error) {
          console.error('Error starting application:', error);
          document.getElementById('root').innerHTML = `
            <div class="bg-red-100 p-6 rounded-lg shadow-md max-w-md mx-auto text-center text-red-700">
              <h2 class="text-xl font-bold mb-2">Ett fel uppstod</h2>
              <p>${error.message}</p>
              <p class="mt-4">Pröva att ladda om sidan.</p>
            </div>
          `;
        }
      }, 500);
    });
  </script>
</body>
</html>
